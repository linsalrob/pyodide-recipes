package:
  name: phispy
  version: 5.0.7
  top-level:
    - PhiSpyModules
    - PhiSpyRepeatFinder

source:
  url: https://files.pythonhosted.org/packages/source/p/phispy/phispy-5.0.7.tar.gz
  sha256: dba6b2a8412fa672a8c62cc0d6bf827d580da8244cff7771f843bb435b92fd79

build:
  cxxflags: -fwasm-exceptions
  ldflags: -fwasm-exceptions

requirements:
  run:
    - biopython
    - numpy
    - scikit-learn

test:
  imports:
    - PhiSpyModules
    - PhiSpyRepeatFinder

about:
  home: https://github.com/linsalrob/PhiSpy
  PyPI: https://pypi.org/project/PhiSpy
  summary: Prophage finder using multiple metrics
  license: MIT

extra:
  recipe-maintainers:
    - linsalrob
